<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffecd2);
            color: #d63384;
            text-align: center;
            padding: 50px;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        p {
            font-size: 1.5em;
            margin-bottom: 40px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            font-size: 1.5em;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #yes {
            background-color: #ff6b9d;
            color: white;
            transform: scale(1);
        }
        #no {
            background-color: #ffb3ba;
            color: #d63384;
        }
        #no:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            color: #ff6b9d;
            font-size: 2em;
            animation: float 6s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <h1>¿Quieres ser mi San Valentín? 💕</h1>
    <p>Sara Sophia González Reyna, mi amor. ¿Aceptas ser mi San Valentín este año?</p>
    <div class="buttons">
        <button id="yes">¡SÍ! 😍</button>
        <button id="no">No 😢</button>
    </div>

    <script>
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const heartsContainer = document.getElementById('hearts');
        let scale = 1;

        // Crear corazones flotantes
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 6 + 's';
            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }
        setInterval(createHeart, 500);

        // Funcionalidad de los botones
        noBtn.addEventListener('click', () => {
            noBtn.disabled = true;
            scale += 0.5;
            yesBtn.style.transform = `scale(${scale})`;
            yesBtn.style.fontSize = `${1.5 * scale}em`;
            yesBtn.style.padding = `${15 * scale}px ${30 * scale}px`;
        });

        yesBtn.addEventListener('click', () => {
            alert('¡Yay! Te amo mucho, mi San Valentín. 💖');
        });
    </script>
</body>
</html>
